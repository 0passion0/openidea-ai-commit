# OpenIDEA Plugin: AI Commit
id = "local.ai-commit"
name = "AI Commit"
version = "0.2.0"
description = "One-shot commit message generator for any OpenAI-compatible server, with git-diff optimization and strict 150 KB input bounding."
authors = ["local"]
license = "MIT"
change-notes = "0.2.0 — Optimize prompt and defaults for structured, detailed Chinese Conventional Commits (subject + `- ` bullet list), include per-file line deltas in prompt manifest, and normalize full-width colons/bullets/fences in model responses."
categories = ["vcs", "ai"]
icon = "icons/icon.svg"
icon-dark = "icons/icon_dark.svg"
engines.openidea = "^1.5"
wasm = "dist/plugin.wasm"

[capabilities]
required = ["vcs.read", "vcs.write", "storage", "net:127.0.0.1", "net:ask"]
optional = ["net:localhost", "secrets", "clipboard"]

[[contributes.commands]]
id = "generate"
title = "Generate Commit Message with AI"
category = "AI Commit"

[[contributes.commands]]
id = "insert"
title = "Insert Last AI Commit Message"
category = "AI Commit"

[[contributes.commands]]
id = "copy"
title = "Copy Last AI Commit Message"
category = "AI Commit"

[[contributes.commands]]
id = "test-connection"
title = "Test AI Commit Server"
category = "AI Commit"

[[contributes.menus]]
menu = "commit.message"
command = "generate"

[[contributes.commitChecks]]
id = "conventional"
title = "Conventional Commits message"

[[contributes.secrets]]
name = "api-key"
label = "OpenAI-compatible API key (keychain override)"
description = "Optional keychain override sent as Bearer token. When unset, the API key in Server settings is used."

[contributes.settings]
title = "AI Commit"

[[contributes.settings.pages]]
id = "general"
title = "Message"
schema = "settings/general.json"

[[contributes.settings.pages]]
id = "server"
title = "Server"
schema = "settings/server.json"

[[contributes.settings.pages.actions]]
title = "Test connection"
command = "test-connection"
