[workspace]
resolver = "3"
members = [
    "crates/ai-core",
    "crates/ai-commit",
    "crates/ai-code-helper",
    "plugins/ai-assistant",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.42" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ai-core = { path = "crates/ai-core" }
ai-commit = { path = "crates/ai-commit" }
ai-code-helper = { path = "crates/ai-code-helper" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
clone_on_ref_ptr = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
