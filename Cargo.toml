[package]
name = "openidea-plugin-local-ai-commit"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "One-shot OpenAI-compatible commit message plugin for OpenIDEA with git-diff optimization and 150 KB input bounding."
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.42" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
clone_on_ref_ptr = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
